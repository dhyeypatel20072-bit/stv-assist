<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STV Assist · Surat Airport AR Assistant</title>
<meta name="description" content="Concept prototype by Group 3, AURO University: AR guidance for flight delays at Surat Airport.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1A2B;--card:#16263D;--line:#24364F;--line2:#2A3B55;--muted:#A9B6C8;--soft:#C9D3E0;--acc:#F6C343;--teal:#4FD1C5;--blue:#8FB8FF;--orange:#FF8A4C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070D17;font-family:Manrope,system-ui,sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:390px;height:844px;transform-origin:center center;flex-shrink:0}
#app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:600px){#app{border-radius:36px;box-shadow:0 0 0 10px #1a2232,0 30px 80px rgba(0,0,0,.6)}}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.row{display:flex;align-items:center}
.pad{padding:28px 24px 0}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.cap{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.primary{height:56px;border-radius:16px;border:0;background:var(--acc);color:var(--bg);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.ghost{height:48px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:#fff;font-size:15px;font-weight:600;width:100%}
.ok{background:#13283A;border:1px solid var(--teal);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;color:#CDEFEA;font-weight:600}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid #22344D;padding:8px 8px 22px;background:#0B1524}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);background:none;border:0}
nav.tabs button.on{color:var(--acc);font-weight:700}
.grow{flex-grow:1}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);color:#fff}
.opt.on{border-color:var(--acc)}
.radio{width:22px;height:22px;border-radius:999px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.on .radio{border-color:var(--acc)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--acc)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:92px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:#fff;text-align:left}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--bg);background:var(--teal);border-radius:999px;padding:3px 8px}
.pill{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:#fff;font-size:13px;font-weight:700;flex:1}
.pill.on{border-color:var(--acc)}
.field{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:#fff;padding:0 14px;font-family:inherit;font-size:15px;width:100%}
textarea.field{height:auto;padding:12px 14px;resize:none;font-size:14px}
label.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
@keyframes flow{to{stroke-dashoffset:-40}} .flow{animation:flow 1s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes ping{0%{r:9;opacity:.7}100%{r:26;opacity:0}} .ping{animation:ping 1.6s ease-out infinite}
.glass{background:rgba(14,26,43,.85)}
.sheetwrap{position:absolute;inset:0;background:rgba(5,10,18,.66);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet{background:#13223A;border-top:1px solid var(--line2);border-radius:28px 28px 0 0;padding:12px 24px 28px;display:flex;flex-direction:column;gap:16px}
</style>
</head>

  if(S.sheet==='food'){
    const places=[['Food court','Near security · 2 min walk','Voucher OK','#4FD1C5'],['Café by Gate 2','Tea, coffee, snacks · 1 min walk','Voucher OK','#4FD1C5'],['Lounge','Quiet seating, charging, Wi-Fi','[ACCESS]','#8FB8FF']];
    body=`<div style="display:flex;flex-direction:column;gap:10px">${places.map(p=>`<div class="card row" style="justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px"><div><div style="font-size:15px;font-weight:800">${p[0]}</div><div style="font-size:13px;color:var(--muted);margin-top:2px">${p[1]}</div></div><span style="font-size:12px;font-weight:800;color:${p[3]};white-space:nowrap">${p[2]}</span></div>`).join('')}</div>
    <div class="row" style="gap:10px"><button class="ghost" style="height:52px;flex:1" data-act="openSheet" data-v="meal">Meal voucher</button><button class="primary" style="height:52px;flex:1.3" data-go="map">Show on map</button></div>`;
  }
  if(S.sheet==='staff'){
    const tp=TOPICS.find(x=>x[0]===S.topic)[1], st=S.staffStage;
    if(st===0) body=`<div style="font-size:13px;font-weight:700;color:var(--muted)">What do you need help with?</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${TOPICS.map(x=>`<button class="pill ${x[0]===S.topic?'on':''}" style="font-size:14px" data-act="topic" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
      <label class="lab">Add a note (optional)<textarea class="field" id="note" rows="2" placeholder="e.g. travelling with my parents, need seats together">${esc(S.note)}</textarea></label>
      <button class="primary" style="height:52px" data-act="sendStaff">Send request</button>`;
    else body=`<div class="card row" style="border-radius:18px;padding:16px;gap:14px">
        <div style="width:48px;height:48px;border-radius:999px;background:${ACC};color:#0E1A2B;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">R</div>
        <div><div style="font-size:12px;color:var(--muted);font-weight:600">Assigned to</div><div style="font-size:16px;font-weight:800">Riya · IndiGo ground staff</div><div style="font-size:13px;color:var(--soft)">Request #STV-1042 · ${tp}</div></div></div>
      <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">${STAGES.map((l,k)=>{const d=k<st;return `<li class="row" style="gap:12px"><span style="width:22px;height:22px;border-radius:999px;background:${d?ACC:'transparent'};border:2px solid ${d?ACC:'#3B5070'};flex-shrink:0"></span><span style="font-size:14px;font-weight:700;color:${d?'#fff':'#7F8FA8'}">${l}</span></li>`}).join('')}</ol>
      <div class="row" style="gap:10px"><button class="ghost" style="height:52px;flex:1" data-act="cancelStaff">Cancel request</button>
      ${st>=4?`<button style="flex:1.3;height:52px;border-radius:16px;border:0;background:var(--teal);color:#0E1A2B;font-size:15px;font-weight:800" data-act="closeSheet">Done</button>`
             :`<button class="primary" style="height:52px;flex:1.3;font-size:15px" data-act="advanceStaff">${st<3?'Riya is on the way':'Riya has arrived'}</button>`}</div>`;
  }
  return `<div class="sheetwrap"><button data-act="closeSheet" aria-label="Close panel" style="flex-grow:1;border:0;background:transparent"></button>
    <div class="sheet" role="dialog" aria-label="${TITLES[S.sheet]}">
      <div style="align-self:center;width:40px;height:5px;border-radius:999px;background:#3B5070"></div>
      <div class="row" style="justify-content:space-between"><div style="font-size:20px;font-weight:800">${TITLES[S.sheet]}</div>
        <button class="iconbtn" style="width:40px;height:40px;border-radius:999px" data-act="closeSheet" aria-label="Close">${svg(IC.close,2.4,'width="18" height="18"')}</button></div>
      ${body}
    </div></div>`;
}
function helpScreen(){
  const p=FLIGHT_OPTS.find(o=>o.id===S.picked), st=S.staffStage;
  const tile=(act,ic,label,badge)=>`<button class="tile" data-act="openSheet" data-v="${act}"><span style="color:var(--blue)">${svg(IC[ic])}</span><span style="font-size:14px;font-weight:700">${label}</span>${badge?`<span class="badge">${badge}</span>`:''}</button>`;
  return `${header('Need help?','alert')}
  <div style="padding:20px 24px 0">
    <div class="cap">Change your flight</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      ${FLIGHT_OPTS.map(o=>`<button class="opt ${o.id===S.picked?'on':''}" data-act="pick" data-v="${o.id}" aria-pressed="${o.id===S.picked}"><span class="radio"></span>
        <span class="grow"><span style="display:block;font-size:15px;font-weight:800">${o.t}</span><span style="display:block;font-size:13px;color:var(--muted);margin-top:2px">${o.s}</span></span>
        <span style="font-size:13px;font-weight:800;color:${o.tc}">${o.tag}</span></button>`).join('')}
    </div>
    ${S.confirmed?`<div class="ok" role="status" style="margin-top:10px">Done. ${p.done} Your new boarding pass is in the app and by SMS.</div>`:`<button class="primary" style="height:52px;margin-top:12px" data-act="confirm">Confirm choice</button>`}
  </div>
  <div style="padding:22px 24px 0">
    <div class="cap">While you wait</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px">
      ${tile('meal','meal','Meal voucher',S.mealDone?'Ready':'')}${tile('wheel','wheel','Wheelchair help',S.wheelDone?'Booked':'')}
      ${tile('cab','cab','Book a cab',S.cabDone?'Booked':'')}${tile('food','pin','Lounges &amp; food','')}
    </div>
  </div>
  <div class="grow"></div>
  <div style="padding:0 24px 16px"><button class="ghost row" data-act="openSheet" data-v="staff" style="height:52px;justify-content:center;gap:10px;font-weight:700;border-color:${st>0?ACC:'var(--line2)'}">${svg(IC.chat,2,'width="20" height="20"')}${st===0?'Talk to airline staff':(st>=4?'Riya has arrived':'Staff request · Riya assigned')}</button></div>
  ${tabs('help')}
  ${sheet()}`;
}

/* ---------- engine ---------- */
const SCREENS={alert:alertScreen,gate:gateScreen,ar:arScreen,map:mapScreen,help:helpScreen};
const app=document.getElementById('app');
function render(){ app.innerHTML = SCREENS[S.screen](); }
const ACTS={
  arNext:()=>set({step:Math.min(S.step+1,STEPS.length-1)}),
  arBack:()=>set({step:Math.max(S.step-1,0)}),
  arRestart:()=>set({step:0}),
  crowds:()=>set({crowds:!S.crowds}),
  pick:v=>set({picked:v,confirmed:false}),
  confirm:()=>set({confirmed:true}),
  openSheet:v=>set({sheet:v}),
  closeSheet:()=>set({sheet:null}),
  claimMeal:()=>set({mealDone:true}),
  meet:v=>set({meet:v,wheelDone:false}),
  need:v=>set({need:v,wheelDone:false}),
  bookWheel:()=>set({wheelDone:true}),
  cab:v=>set({cab:v,cabDone:false}),
  bookCab:()=>set({cabDone:true}),
  topic:v=>set({topic:v}),
  sendStaff:()=>set({staffStage:2}),
  cancelStaff:()=>set({staffStage:0}),
  advanceStaff:()=>set({staffStage:Math.min(S.staffStage+1,4)})
};
app.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){ location.hash=go.dataset.go; return; }
  const a=e.target.closest('[data-act]');
  if(a && !a.disabled && ACTS[a.dataset.act]) ACTS[a.dataset.act](a.dataset.v);
});
app.addEventListener('input',e=>{ if(e.target.id==='dest') S.dest=e.target.value; if(e.target.id==='note') S.note=e.target.value; });
function route(){ const h=location.hash.slice(1); S.screen=SCREENS[h]?h:'alert'; S.sheet=null; render(); }
window.addEventListener('hashchange',route);
setInterval(()=>{ if(S.left>0) S.left--; if(S.screen==='gate'){ const m=document.getElementById('cd-mm'), s=document.getElementById('cd-ss'); if(m){m.textContent=pad2(Math.floor(S.left/60)); s.textContent=pad2(S.left%60);} } },1000);
function fit(){ const sc=Math.min(window.innerWidth/390, window.innerHeight/844, window.innerWidth>=600?0.95:1.2); document.getElementById('stage').style.transform=`scale(${sc})`; }
window.addEventListener('resize',fit); fit(); route();
</script>
</body>
</html>
